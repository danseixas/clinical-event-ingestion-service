services:
  mongo:
    # 7.0 rather than 8.x/9.x: those refuse to start on Linux kernels
    # 6.19-7.0.13 (SERVER-121912), which recent Docker VMs run.
    image: mongo:7.0
    # A single-node replica set: majority writes need a replica set.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first run, then reports healthy only
      # once this node is a writable primary.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  app:
    build: .
    # tini as PID 1, so SIGTERM reaches Node and shutdown hooks run.
    init: true
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT_MS, so in-flight events can finish.
    stop_grace_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      - MONGO_URI=mongodb://mongo:27017/ingest?replicaSet=rs0
      # Passed through from the shell when set; defaults live in the app.
      - WORKER_CONCURRENCY
      - LEASE_MS
      - POLL_INTERVAL_MS
      - PROCESSING_DELAY_MS
      - PROCESSING_TIMEOUT_MS
      - FAILURE_RATE
      - MAX_ATTEMPTS
      - BACKOFF_BASE_MS
      - BACKOFF_MAX_MS
      - SHUTDOWN_TIMEOUT_MS
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
